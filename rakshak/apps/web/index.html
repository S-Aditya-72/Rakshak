<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RAKSHAK Demo</title>
    <script>
      // Android app: reopen straight into this phone's role (chosen once in setup), before the app connects anywhere.
      try {
        var cap = window.Capacitor;
        if (cap && cap.isNativePlatform && cap.isNativePlatform() && (location.hash === '' || location.hash === '#/')) {
          var d = JSON.parse(localStorage.getItem('rakshak.device') || 'null');
          location.hash = d && d.role ? '#/m/' + d.role : '#/app';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
